name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Только чтение репозитория + выпуск OIDC-токена для входа в AWS.
permissions:
  contents: read
  id-token: write

# Деплои идут строго по очереди, без отмены начатого.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository variables from `terraform output github_variables` in bleschunov/infra.
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_PREFIX: ${{ vars.S3_PREFIX }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Check repository variables
        run: |
          missing=0
          for v in AWS_ROLE_ARN S3_BUCKET S3_PREFIX CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set (see bleschunov/infra)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Сайт лежит в префиксе elizarowa.com/ общего бакета static-sites.
      # Сначала файлы (картинки, css, js), потом HTML — чтобы новые страницы
      # не ссылались на ещё не загруженные файлы.
      # HTML: браузер всегда перепроверяет, CloudFront кеширует до инвалидации.
      - name: Upload to S3
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/$S3_PREFIX/" --delete --no-progress \
            --exclude '*.html' --exclude '.DS_Store' \
            --cache-control 'public, max-age=86400'
          aws s3 sync site/ "s3://$S3_BUCKET/$S3_PREFIX/" --delete --no-progress \
            --exclude '*' --include '*.html' \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=0, s-maxage=31536000, must-revalidate'

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text
