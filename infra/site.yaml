AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  elizarowa.com: DNS-зона Route 53 (включая почту Mailgun), приватный S3-бакет,
  CloudFront с HTTPS и заголовками безопасности. Разворачивается в us-east-1
  (требование CloudFront к сертификату ACM). Запуск: infra/deploy.sh

Parameters:
  DomainName:
    Type: String
    Default: elizarowa.com

  EnableSite:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: >-
      'false' — только DNS-зона: записи сайта смотрят на старый сервер (LegacyServerIp),
      чтобы NS можно было переключить без простоя.
      'true' — сертификат, бакет, CloudFront; записи сайта переключаются на CloudFront.
      Сертификат проверяется через Route 53, поэтому включать только после смены NS.

  LegacyServerIp:
    Type: String
    Default: 31.184.253.136
    Description: IP старого VPS, используется только пока EnableSite = 'false'.

  DeployRoleName:
    Type: String
    Default: ''
    Description: >-
      Имя уже существующей IAM-роли для GitHub Actions (OIDC). Если задано,
      к ней добавится минимальная политика: запись в бакет и инвалидация CloudFront.

Conditions:
  SiteEnabled: !Equals [!Ref EnableSite, 'true']
  AttachDeployPolicy: !And
    - !Condition SiteEnabled
    - !Not [!Equals [!Ref DeployRoleName, '']]

Resources:
  # ── DNS ──────────────────────────────────────────────────────────────────

  HostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DomainName

  # Почта (Mailgun) — перенесено из DNS Squarespace как есть.
  MailMx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: MX
      TTL: '3600'
      ResourceRecords:
        - 10 mxa.mailgun.org.
        - 10 mxb.mailgun.org.

  MailSpf:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: TXT
      TTL: '3600'
      ResourceRecords:
        - '"v=spf1 include:mailgun.org ~all"'

  MailDkim:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub mx._domainkey.${DomainName}
      Type: TXT
      TTL: '3600'
      ResourceRecords:
        - '"k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC09b/JsqilwgqwBiFsEIf8v18XC66ceBJw5/xRHCEwYaIvtVkk1GhMzwFgeAsPFthRb7D+8GLVHI8aN9n1PfjLYE1OqkBAKNVV2DzEtapsv+ETuA/EU2EeIauOr0TslZmyvl1epGZkOMxKgKXeE64zjSMAXLJPw2iyR5dYIivzKwIDAQAB"'

  MailDmarc:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub _dmarc.${DomainName}
      Type: TXT
      TTL: '3600'
      ResourceRecords:
        - '"v=DMARC1; p=none; pct=100; fo=1; ri=3600; rua=mailto:32a1088@dmarc.mailgun.org,mailto:7a82e45f@inbox.ondmarc.com; ruf=mailto:32a1088@dmarc.mailgun.org,mailto:7a82e45f@inbox.ondmarc.com;"'

  # Записи сайта. Один и тот же ресурс переключается со старого IP на CloudFront
  # (Route 53 делает UPSERT), поэтому переход без промежутка без записи.
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      TTL: !If [SiteEnabled, !Ref AWS::NoValue, '300']
      ResourceRecords: !If [SiteEnabled, !Ref AWS::NoValue, [!Ref LegacyServerIp]]
      AliasTarget: !If
        - SiteEnabled
        - DNSName: !GetAtt Distribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # фиксированная зона всех CloudFront-дистрибуций
        - !Ref AWS::NoValue

  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub www.${DomainName}
      Type: A
      TTL: !If [SiteEnabled, !Ref AWS::NoValue, '300']
      ResourceRecords: !If [SiteEnabled, !Ref AWS::NoValue, [!Ref LegacyServerIp]]
      AliasTarget: !If
        - SiteEnabled
        - DNSName: !GetAtt Distribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2
        - !Ref AWS::NoValue

  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Condition: SiteEnabled
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Condition: SiteEnabled
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub www.${DomainName}
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # Разрешаем выпускать сертификаты для домена только Amazon (CAA).
  Caa:
    Type: AWS::Route53::RecordSet
    Condition: SiteEnabled
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: CAA
      TTL: '3600'
      ResourceRecords:
        - 0 issue "amazon.com"
        - 0 issue "amazontrust.com"
        - 0 issue "awstrust.com"
        - 0 issue "amazonaws.com"
        - 0 issuewild ";"

  # ── HTTPS-сертификат ─────────────────────────────────────────────────────

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: SiteEnabled
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub www.${DomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZone
        - DomainName: !Sub www.${DomainName}
          HostedZoneId: !Ref HostedZone

  # ── Хранилище (приватное, доступ только у CloudFront) ───────────────────

  Bucket:
    Type: AWS::S3::Bucket
    Condition: SiteEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub
        - ${Name}-site-${AWS::AccountId}
        - Name: !Join ['-', !Split ['.', !Ref DomainName]]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Версии позволяют откатить случайно удалённые/перезаписанные файлы.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: SiteEnabled
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub ${Bucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ── CloudFront ───────────────────────────────────────────────────────────

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: SiteEnabled
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Viewer request: всё, что пришло не на основной домен (www, *.cloudfront.net),
  # уводим 301 на https://<домен>; «красивые» URL (/about, /blog/) → index.html.
  RouterFunction:
    Type: AWS::CloudFront::Function
    Condition: SiteEnabled
    Properties:
      Name: !Sub ${AWS::StackName}-router
      AutoPublish: true
      FunctionConfig:
        Comment: Canonical host redirect and directory index rewrite
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          var uri = request.uri;

          if (host !== '${DomainName}') {
            var qs = Object.keys(request.querystring).map(function (key) {
              var item = request.querystring[key];
              var values = item.multiValue ? item.multiValue.map(function (m) { return m.value; }) : [item.value];
              return values.map(function (v) { return v === '' ? key : key + '=' + v; }).join('&');
            }).join('&');
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + uri + (qs ? '?' + qs : '') } }
            };
          }

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: SiteEnabled
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          # script-src не ограничиваем: GTM подгружает теги, состав которых
          # меняется в интерфейсе GTM, а не в репозитории (см. README → Безопасность).
          ContentSecurityPolicy:
            ContentSecurityPolicy: "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), usb=()
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: SiteEnabled
    Properties:
      DistributionConfig:
        Comment: !Ref DomainName
        Enabled: true
        Aliases:
          - !Ref DomainName
          - !Sub www.${DomainName}
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN
        # Без s3:ListBucket S3 отвечает 403 на несуществующий ключ — тоже отдаём 404.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # ── Права для GitHub Actions (роль с OIDC уже существует) ────────────────

  DeployPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: AttachDeployPolicy
    Properties:
      RoleName: !Ref DeployRoleName
      PolicyName: !Sub ${AWS::StackName}-deploy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBucket
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt Bucket.Arn
          - Sid: WriteObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub ${Bucket.Arn}/*
          - Sid: Invalidate
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
            Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  NameServers:
    Description: Эти NS прописываются в Squarespace → Domain Nameservers
    Value: !Join [' ', !GetAtt HostedZone.NameServers]
  HostedZoneId:
    Value: !Ref HostedZone
  BucketName:
    Condition: SiteEnabled
    Value: !Ref Bucket
  DistributionId:
    Condition: SiteEnabled
    Value: !Ref Distribution
  DistributionDomainName:
    Condition: SiteEnabled
    Value: !GetAtt Distribution.DomainName
